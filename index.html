<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ödeme Bildirimi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:white;border-radius:20px;padding:28px;width:100%;max-width:400px;text-align:center;box-shadow:0 12px 35px #0002}
.small{color:#64748b;font-size:14px}
.amount{font-size:42px;font-weight:bold;color:#15803d;margin:25px 0}
.pill{background:#dcfce7;color:#166534;padding:9px 16px;border-radius:30px;display:inline-block}
.note{font-size:12px;color:#64748b;margin-top:24px}
#surprise{display:none;background:#07170b;color:white}
#surprise h1{color:#5cff8d}
</style>
</head>
<body>
<div class="card" id="payment">
<div class="small">ÖDEME BİLDİRİMİ</div>
<h2>Hesabınıza para yatırıldı</h2>
<div class="amount">+5.000,00 €</div>
<div class="pill">✓ İşlem başarılı</div>
<p class="small">Alıcı: Renato</p>
<p class="note">Demo bildirim • Gerçek banka işlemi değildir</p>
</div>
<div class="card" id="surprise">
<h1>😂 YAKALANDIN RENATO!</h1>
<h2>5.000 € değil, 5.000 öpücük kazandın! 💋</h2>
<p>Seni seviyorum! ❤️</p>
<p>— Karın</p>
</div>
<script>
setTimeout(function(){
document.getElementById("payment").style.display="none";
document.getElementById("surprise").style.display="block";
document.body.style.background="#07170b";
},7000);
</script>
</body>
</html>
