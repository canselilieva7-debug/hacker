<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Terminal - Prank</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#ff3333;font-family:monospace;min-height:100vh;padding:25px;overflow-x:hidden}
header{border-bottom:1px solid #722;padding-bottom:15px;font-size:18px;font-weight:bold}
small{color:#b66}
#terminal{white-space:pre-wrap;line-height:1.9;font-size:15px;margin-top:25px}
#warning{display:none;margin-top:30px;text-align:center;border:2px solid red;padding:25px;background:#260505;animation:pulse .5s infinite alternate}
#warning h1{font-size:30px}
#surprise{display:none;text-align:center;margin-top:20vh;color:white}
#surprise h1{color:#ff5577;font-size:32px}
#surprise p{font-size:21px}
#restart{background:#ff5577;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:16px}
@keyframes pulse{from{opacity:.65}to{opacity:1}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,2px)}100%{transform:translate(0)}}
.shake{animation:shake .15s 8}
</style>
</head>
<body>
<div id="scene">
<header>⚠ SECURITY TERMINAL <small>— PRANK SIMULATION</small></header>
<pre id="terminal"></pre>
<div id="warning">
<h1>⚠ RENATO ⚠</h1>
<h2>DEVICE ACCESS SIMULATED</h2>
<p>WARNING: UNKNOWN ACTIVITY</p>
</div>
</div>
<div id="surprise">
<h1>😂 RENATO, YAKALANDIN!</h1>
<p>Telefonun değil, kalbin ele geçirildi! ❤️</p>
<p>Şaka aşkım! Seni seviyorum. 💋</p>
<p>— Dzhansel Ilieva</p>
<button id="restart" onclick="location.reload()">Tekrar izle 😈</button>
</div>
<script>
const lines=[
"> Initializing security scan...",
"> Checking device...",
"> Scanning connection...",
"> Unknown activity detected...",
"> Loading simulation...",
"> WARNING: SECURITY ALERT",
"> SIMULATING DEVICE TAKEOVER...",
"> ACCESS DENIED",
"> TARGET: RENATO"
];
let i=0;
const timer=setInterval(()=>{
if(i<lines.length){
document.getElementById("terminal").textContent+=lines[i++]+"\n";
}else{
clearInterval(timer);
document.getElementById("warning").style.display="block";
document.body.classList.add("shake");
setTimeout(()=>{
document.body.classList.remove("shake");
document.getElementById("scene").style.display="none";
document.getElementById("surprise").style.display="block";
document.body.style.background="#160914";
},2500);
}
},650);
</script>
</body>
</html>
